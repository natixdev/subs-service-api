[project]
name = 'subs-service-api'
version = '0.1.0'
description = 'REST API для учета финансовых обязательств (подписки, счета, страховки)'
readme = 'README.md'
requires-python = '>=3.13'
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.41",
    "asyncpg>=0.30.0",
    "alembic>=1.16.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.10.1",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.3",
    "aiosqlite>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = 'auto'
